/* =================== HELPERS =================== */
function el(tag, attrs, children) {
  var e = document.createElement(tag);
  for (var k in (attrs||{})) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(function(c){ if (c) e.appendChild(c); });
  return e;
}
function txt(s){ return document.createTextNode(s); }
function svgEl(tag, attrs) {
  var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (var k in (attrs||{})) e.setAttribute(k, attrs[k]);
  return e;
}
function fmtPct(v){ return (Math.round(v*10)/10).toFixed(1); }

/* =================== RANK CHART (reusable) =================== */
function renderRankChart(container, opts) {
  // opts: { series: [{data, cls, label}], imputedFrom, events, weeks, title }
  var W = 720, H = 260, padL = 34, padR = 16, padT = 12, padB = 26;
  var plotW = W - padL - padR, plotH = H - padT - padB;
  var weeks = opts.weeks;
  var allVals = [];
  opts.series.forEach(function(s){ s.data.forEach(function(v){ if (v!=null) allVals.push(v); }); });
  var yMax = Math.max.apply(null, allVals) + 10, yMin = 1;
  function x(i){ return padL + (i/(weeks.length-1)) * plotW; }
  function y(v){ return padT + ((v-yMin)/(yMax-yMin)) * plotH; }

  container.innerHTML = '';
  var svg = svgEl('svg', {viewBox:'0 0 '+W+' '+H, class:'chart'});
  container.appendChild(svg);

  // gridlines
  var niceTicks = [1,25,50,75,100,125,150,175,200,225].filter(function(t){ return t<=yMax; });
  // thin out ticks if too many
  var step = niceTicks.length > 6 ? 2 : 1;
  niceTicks.filter(function(_,i){return i%step===0;}).forEach(function(t){
    var gy = y(t);
    svg.appendChild(svgEl('line',{x1:padL,x2:W-padR,y1:gy,y2:gy,stroke:'var(--grid-line)','stroke-width':1}));
    var lbl = svgEl('text',{x:padL-7,y:gy+3,'text-anchor':'end','font-size':9.5,fill:'var(--ink-3)','font-family':'IBM Plex Mono, monospace'});
    lbl.textContent = t; svg.appendChild(lbl);
  });
  // x labels (sparse, every ~4 weeks)
  weeks.forEach(function(w,i){
    if (i % 4 !== 0 && i !== weeks.length-1) return;
    var lx = x(i);
    var lbl = svgEl('text',{x:lx,y:H-6,'text-anchor':'middle','font-size':9,fill:'var(--ink-3)','font-family':'IBM Plex Mono, monospace'});
    lbl.textContent = w; svg.appendChild(lbl);
  });

  function pathSeg(arr, from, to) {
    var d = '';
    for (var i = from; i <= to; i++) {
      if (arr[i] == null) continue;
      d += (i===from ? 'M':'L') + x(i).toFixed(1) + ',' + y(arr[i]).toFixed(1) + ' ';
    }
    return d;
  }

  opts.series.forEach(function(s){
    var lastReal = s.data.length - 1;
    var impFrom = (s.cls === 'bdo' && opts.imputedFrom != null) ? opts.imputedFrom : null;
    var mainEnd = impFrom != null ? impFrom : lastReal;
    var w = s.cls === 'self' ? 2.5 : 2;
    svg.appendChild(svgEl('path',{d:pathSeg(s.data,0,mainEnd), fill:'none', class:'ln-'+s.cls, 'stroke-width':w, 'stroke-linecap':'round','stroke-linejoin':'round'}));
    if (impFrom != null) {
      svg.appendChild(svgEl('path',{d:pathSeg(s.data,impFrom,lastReal), fill:'none', class:'ln-'+s.cls, 'stroke-width':w, 'stroke-dasharray':'3 4', opacity:0.5}));
    }
    svg.appendChild(svgEl('circle',{cx:x(lastReal), cy:y(s.data[lastReal]), r:4, class:'dot-fill-'+s.cls}));
  });

  // event markers
  (opts.events||[]).forEach(function(ev){
    var yy = y(opts.series[0].data[ev.idx]);
    var c = svgEl('circle',{cx:x(ev.idx), cy: padT-2, r:4.5, class:'evt-'+ev.verdict, 'data-idx':ev.idx});
    c.style.cursor = 'pointer';
    svg.appendChild(c);
    svg.appendChild(svgEl('line',{x1:x(ev.idx),x2:x(ev.idx),y1:padT+2,y2:H-padB,stroke:'var(--line)','stroke-width':1,'stroke-dasharray':'2 3', opacity:0.6}));
  });

  // hover interaction
  var tooltip = el('div',{class:'tooltip'});
  container.appendChild(tooltip);
  var hoverLine = svgEl('line',{x1:0,x2:0,y1:padT,y2:H-padB,stroke:'var(--ink-3)','stroke-width':1,opacity:0});
  svg.appendChild(hoverLine);
  var hoverDots = opts.series.map(function(s){
    var d = svgEl('circle',{r:4.5, class:'dot-fill-'+s.cls, opacity:0, stroke:'var(--surface)','stroke-width':2});
    svg.appendChild(d); return d;
  });
  var overlay = svgEl('rect',{x:padL,y:padT,width:plotW,height:plotH,fill:'transparent',style:'cursor:crosshair'});
  svg.appendChild(overlay);

  function nearest(mx){
    var rel = (mx-padL)/plotW;
    return Math.max(0, Math.min(weeks.length-1, Math.round(rel*(weeks.length-1))));
  }
  function showTip(idx, clientX, clientY, rect){
    var px = x(idx);
    hoverLine.setAttribute('x1',px); hoverLine.setAttribute('x2',px); hoverLine.setAttribute('opacity',0.5);
    var rows = '<div class="tt-h">'+weeks[idx]+'</div>';
    opts.series.forEach(function(s, si){
      var v = s.data[idx];
      var isImp = s.cls==='bdo' && opts.imputedFrom!=null && idx>=opts.imputedFrom;
      hoverDots[si].setAttribute('cx',px); hoverDots[si].setAttribute('cy', v!=null? y(v): -50); hoverDots[si].setAttribute('opacity', v!=null?1:0);
      if (v!=null) rows += '<div class="tt-row"><span class="dot '+s.cls+'"></span>'+s.label+' &nbsp;'+Math.round(v)+'위'+(isImp?' (결측 추정)':'')+'</div>';
    });
    var ev = (opts.events||[]).find(function(e){return e.idx===idx;});
    if (ev) rows += '<div class="tt-row" style="margin-top:4px;"><span class="dot '+ev.verdict+'"></span>'+ev.result+'</div>';
    tooltip.innerHTML = rows;
    var scaleX = rect.width / W, scaleY = rect.height / H;
    tooltip.style.left = (px*scaleX) + 'px';
    tooltip.style.top = (Math.min.apply(null, opts.series.map(function(s){return s.data[idx]!=null?y(s.data[idx]):H;})) * scaleY) + 'px';
    tooltip.style.opacity = 1;
  }
  overlay.addEventListener('mousemove', function(evt){
    var rect = svg.getBoundingClientRect();
    var mx = (evt.clientX - rect.left) * (W/rect.width);
    showTip(nearest(mx), evt.clientX, evt.clientY, rect);
  });
  overlay.addEventListener('mouseleave', function(){
    hoverLine.setAttribute('opacity',0);
    hoverDots.forEach(function(d){ d.setAttribute('opacity',0); });
    tooltip.style.opacity = 0;
  });
}

/* =================== BAR CHART (커뮤니티 언급률) =================== */
function renderBarChart(container, data) {
  var maxV = Math.max.apply(null, data.map(function(d){return d.rate;})) || 1;
  container.innerHTML = '';
  data.forEach(function(d){
    var row = el('div',{class:'bar-row'});
    row.appendChild(el('div',{},[txt(d.game)]));
    var track = el('div',{class:'bar-track'});
    var fill = el('div',{class:'bar-fill dot-fill-'+d.cls, style:'width:'+Math.max(3,(d.rate/maxV*100))+'%'});
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el('div',{class:'mono', style:'text-align:right'},[txt(fmtPct(d.rate)+'%')]));
    container.appendChild(row);
    container.appendChild(el('div',{style:'font-size:11px;color:var(--ink-3);margin:-4px 0 4px 0;'},[txt(d.n)]));
  });
}

/* =================== COHORT LINE CHART (검색 잔존율) =================== */
function renderCohortChart(container, cfg) {
  var W = 640, H = 240, padL = 34, padR = 100, padT = 14, padB = 26;
  var plotW = W - padL - padR, plotH = H - padT - padB;
  function x(i){ return padL + (i/(cfg.cats.length-1)) * plotW; }
  function y(v){ return padT + (1 - v/100) * plotH; }
  container.innerHTML = '';
  var svg = svgEl('svg',{viewBox:'0 0 '+W+' '+H, class:'chart'});
  container.appendChild(svg);
  [0,25,50,75,100].forEach(function(t){
    var gy = y(t);
    svg.appendChild(svgEl('line',{x1:padL,x2:W-padR,y1:gy,y2:gy,stroke:'var(--grid-line)','stroke-width':1}));
    var lbl = svgEl('text',{x:padL-7,y:gy+3,'text-anchor':'end','font-size':9.5,fill:'var(--ink-3)','font-family':'IBM Plex Mono, monospace'});
    lbl.textContent = t+'%'; svg.appendChild(lbl);
  });
  cfg.cats.forEach(function(c,i){
    var lbl = svgEl('text',{x:x(i),y:H-6,'text-anchor':'middle','font-size':10,fill:'var(--ink-3)','font-family':'IBM Plex Mono, monospace'});
    lbl.textContent = c; svg.appendChild(lbl);
  });
  cfg.series.forEach(function(s){
    var d = s.vals.map(function(v,i){ return (i===0?'M':'L')+x(i).toFixed(1)+','+y(v).toFixed(1); }).join(' ');
    svg.appendChild(svgEl('path',{d:d, fill:'none', class:'ln-'+s.cls, 'stroke-width': s.cls==='self'?2.5:2, 'stroke-linecap':'round','stroke-linejoin':'round'}));
    s.vals.forEach(function(v,i){ svg.appendChild(svgEl('circle',{cx:x(i),cy:y(v),r:3,class:'dot-fill-'+s.cls})); });
  });
  // direct end-labels, staggered to avoid collisions when final values are close
  var lastI = cfg.cats.length - 1;
  var labelRows = cfg.series.map(function(s){
    return { cls: s.cls, name: s.game.split(' ')[0], val: s.vals[lastI], y: y(s.vals[lastI]) };
  }).sort(function(a,b){ return a.y - b.y; });
  var MIN_GAP = 13;
  for (var li = 1; li < labelRows.length; li++) {
    if (labelRows[li].y - labelRows[li-1].y < MIN_GAP) labelRows[li].y = labelRows[li-1].y + MIN_GAP;
  }
  labelRows.forEach(function(r){
    var lbl = svgEl('text',{x:x(lastI)+8,y:r.y+3,'font-size':10.5,'font-family':'IBM Plex Mono, monospace', class:'txt-'+r.cls});
    lbl.textContent = r.name+' '+fmtPct(r.val)+'%';
    svg.appendChild(lbl);
  });
}

function computePressure(){
  var s = document.getElementById('simStart').value;
  var en = document.getElementById('simEnd').value || s;
  var titleEl = document.getElementById('simTitle');
  var result = document.getElementById('pressureResult');
  var overlapList = document.getElementById('overlapList');
  overlapList.innerHTML = '';
  if (!s) { result.className='pressure-result low'; result.innerHTML = '<div class="grade">—</div><div class="desc">시작일을 입력해주세요</div>'; return; }
  var sd = new Date(s), ed = new Date(en);
  var overlaps = simState.cal.filter(function(c){
    var cs = new Date(c.start), ce = new Date(c.end);
    return cs <= ed && ce >= sd;
  });
  var hasBig = overlaps.some(function(c){ return c.scale === 'big'; });
  var n = overlaps.length;
  var grade = n===0 ? 'low' : (n===1 ? 'mid' : 'high');
  if (grade==='mid' && hasBig) grade = 'high';
  var gradeLabel = {low:'LOW', mid:'MID', high:'HIGH'}[grade];
  var descMap = {
    low: '겹치는 경쟁사 이벤트가 없습니다 — 예정대로 진행하세요.',
    mid: '경쟁사 1곳과 겹칩니다 — 화제성 모니터링을 강화하세요.',
    high: '경쟁사 '+n+'곳과 겹치며' + (hasBig?' 대형 이벤트가 포함되어 있습니다' : '') + ' — 날짜 조정 또는 카드 강도 보강을 검토하세요.'
  };
  result.className = 'pressure-result ' + grade;
  result.innerHTML = '<div class="grade">'+gradeLabel+'</div><div class="desc">'+descMap[grade]+'</div>';
  if (overlaps.length === 0) {
    overlapList.appendChild(el('li',{},[el('span',{},[txt('겹치는 이벤트 없음')])]));
  } else {
    overlaps.forEach(function(o){
      overlapList.appendChild(el('li',{},[
        el('span',{},[txt(o.game+' · '+o.title)]),
        el('span',{class:'mono'},[txt(o.start.slice(5)+(o.end!==o.start?'~'+o.end.slice(5):'')+' · '+(o.scale==='big'?'대형':o.scale==='mid'?'중형':'소형'))])
      ]));
    });
  }
}
